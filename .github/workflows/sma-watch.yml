name: 200d SMA Watch

on:
  schedule:
    # Ziel: 11:30 Uhr New York = 2 Std. nach Handelsstart (= 17:30 Uhr deutscher Zeit).
    # Cron läuft in UTC; wegen Sommer-/Winterzeit zwei Zeiten (15:30 und 16:30 UTC).
    # Das Skript arbeitet nur im passenden Lauf und meldet höchstens einmal pro Tag.
    # GitHub startet geplante Läufe manchmal mit etwas Verspätung.
    - cron: "30 15,16 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "Sofort prüfen und Push senden (Test, ignoriert Uhrzeit)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: sma-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: SMA prüfen und benachrichtigen
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          FORCE_NOTIFY: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
          ONLY_ON_CROSS: ${{ vars.ONLY_ON_CROSS }}
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python sma_watch.py

      - name: Status speichern
        run: |
          git config user.name "sma-watch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/status.json
          if ! git diff --cached --quiet; then
            git commit -m "Status $(date -u +%F)"
            git push
          fi
